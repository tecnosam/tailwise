# yaml-language-server: $schema=../tailwise.schema.yaml
#
# Jev, the default scorer, tuned for production: questions written for your agent, a
# worker count that suits your Jev plan, and room for a slow network.
#
#   export JEV_API_KEY=...
#   make run CONFIG=examples/jev.yaml
#
# Every trace the engine scores is sent to api.typesafe.ai and billed to the
# key. Only use it for traces you are allowed to send to a third party.
# Keys not listed here keep the engine's built-in defaults
# (tailwise.schema.yaml lists them).

server:
  workers: 4                 # concurrent calls to Jev; lower it if Jev answers 429

queue:
  # A queued trace gets one call to Jev per delivery; when Jev is busy or
  # down the queue redelivers it with redelivery_backoff. ack_wait must exceed
  # that one call (timeout below), or a slow trace is scored twice.
  ack_wait: 2m

scorer:
  kind: jev
  api_key_env: JEV_API_KEY   # the environment variable holding the key (JEV_API_KEY is also the default)
  endpoint: https://api.typesafe.ai/v1/systemone
  model: jev-latest
  # The questions Jev is asked. Start from manifests/my-agent.json and word
  # them for your agent; without a manifest the built-in questions are used,
  # and the engine warns at start-up.
  manifest: manifests/my-agent.json
  decision_question: answer_wrong
  timeout: 30s               # a network round trip
  # Retries on the synchronous endpoint (POST /v1/traces:score) only, which
  # has no queue behind it. Jev answers 429 / 529 when busy.
  max_retries: 3
  backoff: [1s, 5s, 15s]
