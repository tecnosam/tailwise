# yaml-language-server: $schema=../tailwise.schema.yaml
#
# Keep more traces for review: a lower threshold and a larger random sample.
# For a new agent, while you are still learning what its mistakes look like and
# have reviewers to spare. Compare with the defaults: keep_threshold 0.5,
# random_floor 0.02.

policy:
  keep_threshold: 0.35       # keep a trace once its p(wrong) reaches 0.35
  random_floor: 0.05         # and 5% of the rest at random, an unbiased sample to check the model against
