# git-cliff configuration: CHANGELOG.md in the Keep a Changelog format,
# built from Conventional Commit messages (https://www.conventionalcommits.org).
# `make release` uses it to compute the next version and write its section.

[changelog]
header = """
# Changelog

All notable changes to Tailwise are recorded here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^(build|ci|chore|style|test)", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
# A feature bumps the minor version and a fix the patch. Before 1.0.0 a
# breaking change bumps the minor version too, as Semantic Versioning allows.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
