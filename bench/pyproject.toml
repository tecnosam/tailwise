[project]
name = "tailwise-bench"
version = "0.1.0"
description = "Measures how well Tailwise finds agent errors against random sampling, on TRAIL and Who&When."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "tiktoken>=0.7",
]

[project.scripts]
bench = "tailwise_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailwise_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
