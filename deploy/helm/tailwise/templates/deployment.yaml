apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailwise.fullname" . }}
  labels:
    {{- include "tailwise.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.autoscaling.queueDepth.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tailwise.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the config or the manifests change.
        checksum/config: {{ include "tailwise.config" . | sha256sum }}
        checksum/manifests: {{ toYaml .Values.manifests.files | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tailwise.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tailwise.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for the shutdown the engine runs on SIGTERM.
      terminationGracePeriodSeconds: 60
      containers:
        - name: engine
          image: {{ include "tailwise.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/tailwise/tailwise.yaml"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: otlp-grpc, containerPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, protocol: TCP}
          {{- if or .Values.jev.apiKeySecret.name .Values.env }}
          env:
            {{- with .Values.jev.apiKeySecret }}
            {{- if .name }}
            - name: JEV_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .name }}, key: {{ .key }}}}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readinessPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/tailwise/tailwise.yaml, subPath: tailwise.yaml, readOnly: true}
            {{- if include "tailwise.hasManifests" . }}
            - {name: manifests, mountPath: /etc/tailwise/manifests, readOnly: true}
            {{- end }}
            {{- if include "tailwise.embeddedNATS" . }}
            # The embedded NATS server keeps its streams in a temporary
            # directory; the root filesystem is read-only.
            - {name: tmp, mountPath: /tmp}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "tailwise.fullname" . }}}
        {{- if include "tailwise.hasManifests" . }}
        - name: manifests
          configMap: {name: {{ include "tailwise.manifestsConfigMap" . }}}
        {{- end }}
        {{- if include "tailwise.embeddedNATS" . }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "tailwise.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
