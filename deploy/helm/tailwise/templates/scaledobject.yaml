{{- $qd := .Values.autoscaling.queueDepth }}
{{- if $qd.enabled }}
{{- if .Values.autoscaling.enabled }}
{{- fail "tailwise: enable autoscaling (CPU) or autoscaling.queueDepth, not both" }}
{{- end }}
{{- if include "tailwise.embeddedNATS" . }}
{{- fail "tailwise: autoscaling.queueDepth needs the queues in NATS (nats.enabled or queue.url); with embedded NATS each pod's queue is its own" }}
{{- end }}
{{- $queue := .Values.config.queue | default dict }}
{{- $endpoint := $qd.natsMonitoringEndpoint }}
{{- if not $endpoint }}
{{- if not .Values.nats.enabled }}
{{- fail "tailwise: set autoscaling.queueDepth.natsMonitoringEndpoint to your NATS's monitoring address (host:8222)" }}
{{- end }}
{{- $endpoint = printf "%s-headless.%s.svc.cluster.local:8222" (include "tailwise.natsName" .) .Release.Namespace }}
{{- end }}
# Scales the engine on the traces waiting to be scored: the lag of the
# workers' durable consumer, which every engine shares.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "tailwise.fullname" . }}
  labels:
    {{- include "tailwise.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "tailwise.fullname" . }}
  minReplicaCount: {{ $qd.minReplicas }}
  maxReplicaCount: {{ $qd.maxReplicas }}
  pollingInterval: {{ $qd.pollingInterval }}
  cooldownPeriod: {{ $qd.cooldownPeriod }}
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $endpoint | quote }}
        account: {{ $qd.account | quote }}
        stream: {{ printf "%s_TRACES" (upper ($queue.prefix | default "tailwise")) | quote }}
        consumer: {{ printf "%s-workers" ($queue.prefix | default "tailwise") | quote }}
        lagThreshold: {{ $qd.lagThreshold | quote }}
{{- end }}
