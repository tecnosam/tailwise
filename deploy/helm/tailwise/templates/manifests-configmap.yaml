{{- if and .Values.manifests.files (not .Values.manifests.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tailwise.manifestsConfigMap" . }}
  labels:
    {{- include "tailwise.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.manifests.files }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
